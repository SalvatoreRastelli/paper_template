name: Build paper

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Python dependencies
        run: uv sync

      # TeX Live from tlmgr rather than the distro packages, which pulled ~2GB
      # of texlive-*-extra to get a handful of files. The engine stays pdfTeX:
      # aaai2027.sty asserts \RequirePDFTeX, so a XeTeX/LuaTeX-only toolchain
      # cannot build this paper.
      #
      # The two collections cover the documents and their transitive
      # dependencies. Listing leaf packages instead is a trap: newtx pulls
      # xpatch, fontaxes and xstring, none of which appear in any \usepackage
      # line, so a hand-built list fails on the first one it missed.
      # The four trailing packages are Matplotlib's rather than the paper's,
      # since every figure is rendered through LaTeX (text.usetex in
      # scripts/merw.mplstyle).
      #
      # Keep comments out of the `packages` value below: the folded scalar
      # joins it into a single line and the action treats everything after a
      # `#` as a comment to the end of that line, silently discarding every
      # package that follows.
      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: >-
            scheme-basic
            collection-latexrecommended
            collection-fontsrecommended
            latexmk
            newtx
            fontaxes
            xstring
            algorithms
            placeins
            ragged2e
            tabularx
            xspace
            cm-super
            type1cm
            dvipng
            underscore

      - name: Build paper
        run: make

      - name: Upload PDFs
        uses: actions/upload-artifact@v6
        with:
          name: paper-pdf
          path: |
            paper/aaai/main.pdf
            paper/supplementary/supplementary.pdf
