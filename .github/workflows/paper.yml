name: Build paper

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Python dependencies
        run: uv sync

      # TeX Live from tlmgr rather than the distro packages. The apt route
      # pulled ~2GB of texlive-*-extra to get a handful of packages; this
      # installs only what the two documents load and caches the result.
      # The engine stays pdfTeX: aaai2027.sty asserts \RequirePDFTeX, so
      # XeTeX/LuaTeX-only toolchains cannot build this paper.
      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: >-
            scheme-basic
            latexmk
            newtx
            helvetic
            courier
            iftex
            placeins
            xcolor
            algorithms
            amsmath
            amsfonts
            booktabs
            tabularx
            ragged2e
            natbib
            caption
            graphics
            url
            xspace

      - name: Build paper
        run: make

      - name: Upload PDFs
        uses: actions/upload-artifact@v6
        with:
          name: paper-pdf
          path: |
            paper/aaai/main.pdf
            paper/supplementary/supplementary.pdf
